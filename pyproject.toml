[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[project]
name = "python-refactor-mcp"
version = "0.4.1"
description = "MCP server for Python code analysis and refactoring"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Jedi-Py-MCP Contributors" }]
dependencies = [
  "mcp>=1.27",
  "pydantic>=2.13",
  "jedi>=0.20",
  "rope>=1.14",
  "pyright>=1.1.409",
  "libcst>=1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.4",
  "ruff>=0.15",
  "mypy>=1.13",
]
build = [
  "pyinstaller>=6.19",
]

[project.scripts]
python-refactor-mcp = "python_refactor_mcp.__main__:main"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tool docstrings in server.py are intentionally long (LLM-facing descriptions).
"src/python_refactor_mcp/server.py" = ["E501"]
# tool_registry.py carries the same LLM-facing tool docstrings moved out of server.py.
"src/python_refactor_mcp/tool_registry.py" = ["E501"]
# Pre-existing long lines in contract tests and navigation helpers.
"tests/contract/test_mcp_protocol.py" = ["E501"]
"src/python_refactor_mcp/tools/navigation/public_api.py" = ["E501"]
"src/python_refactor_mcp/tools/navigation/hierarchy.py" = ["UP047"]
"tests/unit/test_refactoring_tools.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["python_refactor_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["python_refactor_mcp"]
exclude = ["tests/.*", "build/.*", "dist/.*"]

# The MCP tool wrappers in server.py and the delegate table in tool_registry.py
# both annotate the injected context as the bare generic ``MCPContext`` (= FastMCP
# ``Context``); the framework supplies the type parameters at call time, so the
# strict ``type-arg`` check (and the resulting ``unused-ignore`` noise) is waived
# for exactly these two modules.
[[tool.mypy.overrides]]
module = ["python_refactor_mcp.server", "python_refactor_mcp.tool_registry"]
disable_error_code = ["type-arg", "unused-ignore"]
