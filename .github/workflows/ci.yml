name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  checks:
    name: Static checks + unit/contract tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env

      - name: Validate changelog fragments
        env:
          CHANGELOG_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: .\.venv\Scripts\python scripts/changelog_fragments.py

      - name: Lint (ruff)
        run: .\.venv\Scripts\python -m ruff check .

      - name: Format check (semantic converters)
        run: >-
          .\.venv\Scripts\python -m ruff format --check
          src/python_refactor_mcp/tools/refactoring/_converter_preflight.py
          src/python_refactor_mcp/tools/refactoring/dataclass_conversion.py
          src/python_refactor_mcp/tools/refactoring/typed_dict_conversion.py
          src/python_refactor_mcp/tools/refactoring/pydantic_conversion.py
          tests/unit/test_semantic_converters.py

      - name: Type check (Pyright)
        run: .\.venv\Scripts\python -m pyright .

      - name: Type check (mypy)
        run: .\.venv\Scripts\python -m mypy .

      - name: Unit + contract tests
        run: .\.venv\Scripts\python -m pytest tests/unit/ tests/contract/ -v -n logical --maxprocesses=8

  integration:
    name: Integration tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env

      - name: Integration tests
        run: .\scripts\test-integration.ps1

  # Required status check: branch protection names this job, so it reports the
  # combined result of the parallel jobs above. A failed, cancelled or skipped job fails it.
  validate:
    name: Validate (Python 3.14, Windows)
    needs: [checks, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every validation job to succeed
        shell: bash
        env:
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "checks=$CHECKS integration=$INTEGRATION"
          test "$CHECKS" = success && test "$INTEGRATION" = success
