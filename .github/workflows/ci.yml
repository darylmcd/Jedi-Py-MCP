name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    name: Validate (Python 3.14, Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases-v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # releases-v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync locked dependencies
        run: uv sync --locked --all-extras

      - name: Lint (ruff)
        run: .\.venv\Scripts\python -m ruff check .

      - name: Type check (Pyright)
        run: .\.venv\Scripts\python -m pyright .

      - name: Type check (mypy)
        run: .\.venv\Scripts\python -m mypy .

      - name: Unit + contract tests
        run: .\.venv\Scripts\python -m pytest tests/unit/ tests/contract/ -v

      - name: Integration tests
        run: .\scripts\test-integration.ps1
