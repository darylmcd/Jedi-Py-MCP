name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    name: Validate (Python 3.14, Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync locked dependencies
        run: uv sync --locked --all-extras

      - name: Validate changelog fragments
        env:
          CHANGELOG_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: .\.venv\Scripts\python scripts/changelog_fragments.py

      - name: Lint (ruff)
        run: .\.venv\Scripts\python -m ruff check .

      - name: Type check (Pyright)
        run: .\.venv\Scripts\python -m pyright .

      - name: Type check (mypy)
        run: .\.venv\Scripts\python -m mypy .

      - name: Unit + contract tests
        run: .\.venv\Scripts\python -m pytest tests/unit/ tests/contract/ -v

      - name: Integration tests
        run: .\scripts\test-integration.ps1
